name: bestaiprice

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
      # NEXT_PUBLIC_* vars get baked into the client bundle at build time
      # (a container restart alone won't pick up a change here — rebuild
      # the image). Defaults match the Dockerfile's own ARG defaults;
      # override any of them via a .env file next to this compose file if
      # the gateway ever needs to be reached differently.
      args:
        NEXT_PUBLIC_PROVIDERS_JSON_URL: ${NEXT_PUBLIC_PROVIDERS_JSON_URL:-/gateway/data/providers.json}
        NEXT_PUBLIC_MODELS_JSON_URL: ${NEXT_PUBLIC_MODELS_JSON_URL:-/gateway/data/models.json}
        NEXT_PUBLIC_API_DESCRIPTIONS_JSON_URL: ${NEXT_PUBLIC_API_DESCRIPTIONS_JSON_URL:-/gateway/data/api_descriptions.json}
        NEXT_PUBLIC_PROVIDER_DESCRIPTIONS_JSON_URL: ${NEXT_PUBLIC_PROVIDER_DESCRIPTIONS_JSON_URL:-/gateway/data/provider_descriptions.json}
    container_name: bestaiprice-web
    restart: always
    environment:
      - NODE_ENV=production
      - PORT=3000
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - app-network

  nginx:
    image: nginx:alpine
    container_name: bestaiprice-nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - certbot-certs:/etc/letsencrypt
      - certbot-www:/var/www/certbot
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - web
    networks:
      - app-network

  certbot:
    image: certbot/certbot
    container_name: bestaiprice-certbot
    restart: always
    volumes:
      - certbot-certs:/etc/letsencrypt
      - certbot-www:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while true; do certbot renew; sleep 12h & wait $${!}; done;'"

networks:
  app-network:
    driver: bridge

volumes:
  certbot-certs:
  certbot-www:
