upstream nextjs_web {
    server web:3000;
}

upstream host_gateway {
    server host.docker.internal:8080;
}

# Only "upgrade" on an actual Upgrade request (WebSocket); otherwise
# "close" — hardcoding "upgrade" unconditionally breaks normal HTTP
# keep-alive on the connection to the upstream.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# HTTP - Redirect all traffic to HTTPS, handle ACME challenge
server {
    listen 80;
    listen [::]:80;
    server_name bestaiprice.com www.bestaiprice.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS - Main domain: bestaiprice.com & www.bestaiprice.com
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name bestaiprice.com www.bestaiprice.com;

    ssl_certificate /etc/letsencrypt/live/bestaiprice.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/bestaiprice.com/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    http2 on;

    # sub2api sends headers with underscores; nginx drops those by default.
    underscores_in_headers on;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # Gateway: bestaiprice.com/gateway/* -> host localhost:8080/*
    location /gateway/ {
        proxy_pass http://host_gateway/;
        proxy_http_version 1.1;

        # WebSocket
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # sub2api's own WS/generation timeout is 900s — match it instead
        # of guessing.
        proxy_connect_timeout 30s;
        proxy_send_timeout 900s;
        proxy_read_timeout 900s;

        # Stream SSE / long-running generation responses to the client as
        # they arrive instead of nginx buffering the whole thing first.
        proxy_buffering off;
        proxy_cache off;

        # Allow larger request bodies (image/file uploads) through.
        client_max_body_size 50m;
    }

    # Next.js Web App proxy
    location / {
        proxy_pass http://nextjs_web;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
